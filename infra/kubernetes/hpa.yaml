apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: decision-service-hpa
  namespace: ev-system
  labels:
    app: decision-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: decision-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service-hpa
  namespace: ev-system
  labels:
    app: booking-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

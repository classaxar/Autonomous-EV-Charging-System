apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-service
  namespace: ev-system
  labels:
    app: decision-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: decision-service
  template:
    metadata:
      labels:
        app: decision-service
    spec:
      containers:
        - name: decision-service
          image: autonomous-ev/decision-service:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: PORT
              value: "5005"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: JWT_SECRET
            - name: INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: INTERNAL_KEY
            - name: STATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: STATION_SERVICE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: decision-service
  namespace: ev-system
  labels:
    app: decision-service
spec:
  type: ClusterIP
  selector:
    app: decision-service
  ports:
    - port: 5005
      targetPort: 5005

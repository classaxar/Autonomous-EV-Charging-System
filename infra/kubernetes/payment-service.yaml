apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ev-system
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: autonomous-ev/payment-service:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5007
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          env:
            - name: PORT
              value: "5007"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: NODE_ENV
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: MONGO_URI_PAYMENT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: JWT_SECRET
            - name: INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: INTERNAL_KEY
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: NOTIFICATION_SERVICE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ev-system
  labels:
    app: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 5007
      targetPort: 5007

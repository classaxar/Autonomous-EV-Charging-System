apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ev-system
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: autonomous-ev/api-gateway:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: JWT_SECRET
            - name: INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: INTERNAL_KEY
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: AUTH_SERVICE_URL
            - name: EV_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: EV_SERVICE_URL
            - name: STATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: STATION_SERVICE_URL
            - name: BOOKING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: BOOKING_SERVICE_URL
            - name: DECISION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: DECISION_SERVICE_URL
            - name: CHARGING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: CHARGING_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: PAYMENT_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: NOTIFICATION_SERVICE_URL
            - name: ANALYTICS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: ANALYTICS_SERVICE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ev-system
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: charging-service
  namespace: ev-system
  labels:
    app: charging-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: charging-service
  template:
    metadata:
      labels:
        app: charging-service
    spec:
      containers:
        - name: charging-service
          image: autonomous-ev/charging-service:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5006
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          env:
            - name: PORT
              value: "5006"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: NODE_ENV
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: MONGO_URI_CHARGING
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: JWT_SECRET
            - name: INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: ev-system-secrets
                  key: INTERNAL_KEY
            - name: BOOKING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: BOOKING_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: PAYMENT_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ev-system-config
                  key: NOTIFICATION_SERVICE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: charging-service
  namespace: ev-system
  labels:
    app: charging-service
spec:
  type: ClusterIP
  selector:
    app: charging-service
  ports:
    - port: 5006
      targetPort: 5006

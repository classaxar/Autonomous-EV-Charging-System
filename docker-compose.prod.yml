name: autonomous-ev-system-prod

services:
  mongodb:
    image: mongo:7
    container_name: mongodb-prod
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ev-network

  api-gateway:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/api-gateway:v1.0
    container_name: api-gateway-prod
    restart: always
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
      AUTH_SERVICE_URL: http://auth-service:5001
      EV_SERVICE_URL: http://ev-service:5002
      STATION_SERVICE_URL: http://station-service:5003
      BOOKING_SERVICE_URL: http://booking-service:5004
      DECISION_SERVICE_URL: http://decision-service:5005
      CHARGING_SERVICE_URL: http://charging-service:5006
      PAYMENT_SERVICE_URL: http://payment-service:5007
      NOTIFICATION_SERVICE_URL: http://notification-service:5008
      ANALYTICS_SERVICE_URL: http://analytics-service:5009
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  auth-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/auth-service:v1.0
    container_name: auth-service-prod
    restart: always
    ports:
      - "${AUTH_PORT:-5001}:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/auth_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  ev-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/ev-service:v1.0
    container_name: ev-service-prod
    restart: always
    ports:
      - "${EV_PORT:-5002}:5002"
    environment:
      PORT: 5002
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/ev_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  station-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/station-service:v1.0
    container_name: station-service-prod
    restart: always
    ports:
      - "${STATION_PORT:-5003}:5003"
    environment:
      PORT: 5003
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/station_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  booking-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/booking-service:v1.0
    container_name: booking-service-prod
    restart: always
    ports:
      - "${BOOKING_PORT:-5004}:5004"
    environment:
      PORT: 5004
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/booking_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
      STATION_SERVICE_URL: http://station-service:5003
      NOTIFICATION_SERVICE_URL: http://notification-service:5008
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  decision-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/decision-service:v1.0
    container_name: decision-service-prod
    restart: always
    ports:
      - "${DECISION_PORT:-5005}:5005"
    environment:
      PORT: 5005
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
      STATION_SERVICE_URL: http://station-service:5003
    networks:
      - ev-network

  charging-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/charging-service:v1.0
    container_name: charging-service-prod
    restart: always
    ports:
      - "${CHARGING_PORT:-5006}:5006"
    environment:
      PORT: 5006
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/charging_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
      BOOKING_SERVICE_URL: http://booking-service:5004
      PAYMENT_SERVICE_URL: http://payment-service:5007
      NOTIFICATION_SERVICE_URL: http://notification-service:5008
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  payment-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/payment-service:v1.0
    container_name: payment-service-prod
    restart: always
    ports:
      - "${PAYMENT_PORT:-5007}:5007"
    environment:
      PORT: 5007
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/payment_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
      NOTIFICATION_SERVICE_URL: http://notification-service:5008
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  notification-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/notification-service:v1.0
    container_name: notification-service-prod
    restart: always
    ports:
      - "${NOTIFICATION_PORT:-5008}:5008"
    environment:
      PORT: 5008
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/notification_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  analytics-service:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/analytics-service:v1.0
    container_name: analytics-service-prod
    restart: always
    ports:
      - "${ANALYTICS_PORT:-5009}:5009"
    environment:
      PORT: 5009
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/analytics_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_ev_2026_change_in_prod}
      INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key_2026_ev_system}
      CHARGING_SERVICE_URL: http://charging-service:5006
      PAYMENT_SERVICE_URL: http://payment-service:5007
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ev-network

  frontend:
    image: ${DOCKER_REGISTRY:-autonomous-ev}/frontend:v1.0
    container_name: frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    networks:
      - ev-network

volumes:
  mongo-prod-data:
    driver: local

networks:
  ev-network:
    driver: bridge
